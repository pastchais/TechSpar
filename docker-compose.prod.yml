services:
  techspar-backend:
    image: ${TECHSPAR_BACKEND_IMAGE:-techspar_techspar-backend:latest}
    container_name: techspar-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENV: production
    volumes:
      - ./data:/app/data
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8324:8000"

  techspar-frontend:
    image: ${TECHSPAR_FRONTEND_IMAGE:-techspar_techspar-frontend:latest}
    container_name: techspar-frontend
    restart: unless-stopped
    depends_on:
      - techspar-backend
    expose:
      - "80"

  caddy:
    image: caddy:2
    container_name: techspar-caddy
    restart: unless-stopped
    depends_on:
      - techspar-frontend
      - techspar-backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.runtime/caddy_data:/data
      - ./.runtime/caddy_config:/config
